# A2C via Stable-Baselines3 (synchronous). [algorithm] goes to the SB3 constructor.

[env]
local_awareness = false
max_episode_steps = 10000

[train]
algorithm = "a2c"
total_timesteps = 3000000
n_envs = 16
seed = 0
snapshot_every = 500000  # environment steps
torch_threads = 4        # part of the 80 % CPU budget
device = "cpu"

[algorithm]
learning_rate = 0.0007
n_steps = 8
gamma = 0.99
gae_lambda = 1.0
ent_coef = 0.01
vf_coef = 0.5
