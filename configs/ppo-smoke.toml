# Tiny PPO run to check the train -> snapshot -> load -> playback chain.

[env]
local_awareness = false
max_episode_steps = 10000

[train]
algorithm = "ppo"
total_timesteps = 4096
n_envs = 4
seed = 0
snapshot_every = 2048
torch_threads = 4
device = "cpu"

[algorithm]
n_steps = 256
batch_size = 256
n_epochs = 2
