[project]
name = "snake-ai"
version = "0.1.0"
description = "Shared Snake simulation for comparing NEAT, REINFORCE, A2C, A3C and PPO"
readme = "readme.md"
requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.4,<2",
    "neat-python>=2.0,<3",
    "numpy>=2.5,<3",
    "stable-baselines3>=2.9,<3",
    "torch>=2.15,<3",
]

[project.scripts]
snake-ai = "snake_ai.cli:main"

[project.optional-dependencies]
render = [
    "pygame-ce>=2.5.8,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
